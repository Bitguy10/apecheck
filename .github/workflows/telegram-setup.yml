name: Telegram webhook setup

# Registers the Telegram webhook against production (points Telegram at
# /api/telegram/webhook and syncs the slash-command menu). Run this once after
# the first deploy, and again any time the production domain changes.
#
# Manual only — never on a schedule. Re-registering is idempotent but pointless
# to repeat, and running it needlessly just re-POSTs Telegram.
#
# Requires two repo settings under Settings -> Secrets and variables -> Actions:
#   Secret:   CRON_SECRET  (same value as the Vercel env var)
#   Variable: PROD_URL     (e.g. https://apecheck-xi.vercel.app)
#
# CAUTION: do NOT run the local long-poll relay (cron/telegram-poll.ts) against
# the production bot token — it calls deleteWebhook on start, which silently
# unregisters this webhook and the bot goes quiet again. Re-run this workflow to
# recover.
on:
  workflow_dispatch: {}

jobs:
  telegram-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Register Telegram webhook
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_URL variable or CRON_SECRET secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PROD_URL/api/internal/telegram-setup")
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          # Fail the run on a non-2xx so failures surface in the Actions tab.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
