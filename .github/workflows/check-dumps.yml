name: Dump alert check

# Runs the dump detector every 15 minutes.
# Replaces the Vercel Cron (Hobby plan allows only once-per-day crons).
# Requires two repo settings under Settings -> Secrets and variables -> Actions:
#   Secret:   CRON_SECRET  (same value as the Vercel env var)
#   Variable: PROD_URL     (e.g. https://apecheck.vercel.app)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check-dumps:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dump check
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_URL variable or CRON_SECRET secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PROD_URL/api/internal/check-dumps")
          echo "HTTP $code"
          cat /tmp/body.txt
          # Fail the run on a non-2xx so failures surface in the Actions tab.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
