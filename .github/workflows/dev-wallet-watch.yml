# Portable dev-wallet dump watcher — a free alternative to Vercel Cron.
#
# Vercel Cron (apps/web/vercel.json) is the canonical scheduler. Enable THIS only
# if you'd rather run the check from GitHub (e.g. Hobby plan cron limits), or in
# addition for redundancy. Add these repo secrets under Settings → Secrets → Actions:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and HELIUS_API_KEY (or SOLANA_RPC_URL).
#   Optional: ONESIGNAL_APP_ID, ONESIGNAL_REST_API_KEY.
name: dev-wallet-watch

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: dev-wallet-watch
  cancel-in-progress: false

jobs:
  check-dumps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dump check (single pass)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run cron:dumps
